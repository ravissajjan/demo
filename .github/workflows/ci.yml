name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint project files
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build demo output
        run: npm run build

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-output-${{ matrix.node-version }}
          path: dist/demo-output.json
