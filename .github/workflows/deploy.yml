name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}"/cicd-demo:latest .

      - name: Push image to Docker Hub
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}"/cicd-demo:latest

      - name: Deployment message
        run: |
          echo "Deployment would run here."
          echo "Image pushed to Docker Hub registry demo."
          echo "Environment: production"
